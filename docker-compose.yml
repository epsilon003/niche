version: '3.8'

services:
  backend:
    build: .
    command: uvicorn ui_backend.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  # Optional: Keep the catalyst watcher running in the background
  catalyst-watcher:
    build: .
    command: python -m catalyst_watcher.watcher --interval-min 15
    volumes:
      - .:/app
      - ./data:/app/data
    env_file:
      - .env
    profiles:
      - full