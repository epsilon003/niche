name: Biosignal Trader CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install app dependencies
        pip install -r requirements.txt
        # Install CI/ML tooling
        pip install ruff mypy pytest pytest-asyncio bandit pip-audit

    - name: Lint & Format Check (Ruff)
      run: |
        ruff check .
        ruff format --check .
      # Fails if code is not formatted correctly. Developer must run `ruff format .` locally.

    - name: Static Type Checking (Mypy)
      run: |
        # Run mypy on critical trading paths. Ignore missing imports for 3rd party libs without stubs.
        mypy cross_intelligence/ options_execution/ --ignore-missing-imports
      continue-on-error: true # Soft fail initially, tighten this later

    - name: Security Scan (Bandit)
      run: |
        # Scan for hardcoded credentials, SQL injection, or insecure crypto
        bandit -r . -x tests,venv,.venv,ui

    - name: Dependency Vulnerability Scan (pip-audit)
      run: |
        # Checks if any packages in requirements.txt have known CVEs
        pip-audit -r requirements.txt

    - name: Run Unit Tests (Pytest)
      run: |
        pytest tests/ -v --cov=. --cov-report=xml
      env:
        # Provide dummy env vars so config.py doesn't crash during import
        ALPACA_API_KEY: "dummy_key"
        ALPACA_SECRET_KEY: "dummy_secret"
        ALPACA_PAPER: "true"
        OPENROUTER_API_KEY: "dummy_key"